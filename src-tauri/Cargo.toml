[package]
name = "krevo-account-os"
version = "2.0.1"
description = "Krevo Account OS - internal account operations desktop app"
authors = ["Krevo"]
edition = "2021"

# The library is what the mobile/desktop entry points call into.
[lib]
name = "krevo_account_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
